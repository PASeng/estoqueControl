version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kamilla
      POSTGRES_USER: kamilla
      POSTGRES_PASSWORD: kamilla
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://kamilla:kamilla@db:5432/kamilla
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
